<!DOCTYPE html>
<html lang="en">

    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gallery</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

  <body class="bg-slate-100 font-medium">

    <section class = "py-12">
        <div class = "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div class = "mb-10 text-center">

            </div>


            <div class = "columns-1 sm:columns-2 lg:columns-3 gap-4 space-y-4">

                    <div class="break-inside-avoid-column relative aspect-[4/5] overflow-hidden rounded-3xl border border-slate-200 shadow-sm bg-white group transition-all duration-300 hover:shadow-lg">
                <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=800&q=80" 
                     class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 ease-in-out group-hover:scale-105">
                
                    </div>
                </div>

                <div class="break-inside-avoid-column relative aspect-square overflow-hidden rounded-3xl border border-slate-200 shadow-sm bg-white group transition-all duration-300 hover:shadow-lg">

                     class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 ease-in-out group-hover:scale-105"
                     >
            </div>

            <div class="break-inside-avoid-column relative aspect-[3/2] overflow-hidden rounded-3xl border border-slate-200 shadow-sm bg-white group transition-all duration-300 hover:shadow-lg">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" 
                     class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 ease-in-out group-hover:scale-105"
                     >
            </div>

               



                </div>

            </div>
